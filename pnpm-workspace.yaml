packages:
  - 'apps/*'
  - 'packages/*'
  - 'playwright/*'
# pnpm 11：构建设置移入 pnpm-workspace.yaml（package.json 的 pnpm 字段已废弃）
# esbuild 二进制由 @esbuild/win32-x64 等 optionalDependencies 提供，
# 其 postinstall（node install.js）在受限沙箱中 spawn 子进程会被 EPERM 拦截，
# 故显式跳过该构建脚本（前端 vite 运行不受影响）。
allowBuilds:
  esbuild: false
  # Playwright 浏览器二进制不在此处下载（Worker 用系统 Chrome，channel: 'chrome'）。
  # 显式禁掉 playwright 的 postinstall，避免安装时触发 ~150MB 浏览器下载。
  playwright: false
  playwright-core: false
