# 安全响应头（被每个自带 add_header 的 location 重复 include）
#
# nginx 的 add_header 不继承：只要某个 location 自己写了任何 add_header，
# 父级 server 块里的全部 add_header 就对该 location 失效。
# 因此这里抽成 snippet，凡是出现 add_header 的 location 都必须 include 本文件。
# 回归测试见 scripts/test/security-headers.test.mjs。

# 注意：浏览器对 IP 字面量（如 https://134.175.156.233）会忽略 HSTS —— HSTS 规范
# 只作用于域名。走 IP 路线时这一行实际不产生防护效果，保留是为了将来切换域名后自动生效，
# 且对 IP 访问无副作用。真正起作用的强制跳转由 80 端口的 301 提供。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP：前端为 Vue + Tailwind，运行时会注入内联样式，故 style-src 必须放开 'unsafe-inline'；
# 手册正文支持 data URL 内联插图，img-src 需放行 data:；
# 其余全部锁死到同源，frame-ancestors 'none' 同时封掉点击劫持。
add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
