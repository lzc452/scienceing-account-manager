# Rancher 后备网关的 nginx 站点配置（挂载到容器内 /etc/nginx/conf.d/default.conf）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由回退（刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 扩展分发：/downloads/scienceing-extension.zip（挂载的 dist 目录内）
    # 缺失必须 404，不能回退 index.html，否则用户会下载到 HTML。
    location /downloads/ {
        try_files $uri =404;
        location ~ \.zip$ {
            types { application/zip zip; }
            default_type application/zip;
            add_header Content-Disposition 'attachment';
        }
    }

    # API 反代到 backend 容器
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
}
